[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "opendlss-cuda-compat"
version = "0.1.0"
description = "Optional SM75 CUDA implementation of the OpenDLSS-NR browser compatibility arithmetic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.scripts]
opendlss-cuda = "opendlss_cuda.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
